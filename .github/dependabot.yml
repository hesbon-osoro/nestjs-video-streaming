# Dependabot: security fixes grouped into one PR per ecosystem; other updates once a week.
# Major upgrades are not proposed automatically (they need hand migration).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      weekly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
